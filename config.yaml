paths:
  data_raw: data/raw
  data_processed: data/processed
  models: models
  figures: report/figures
  logs: logs
files:
  sales: Sales.csv
  items: Item.csv
  promotions: Promotion.csv
  supermarkets: Supermarkets.csv
ml:
  target: daily_store_sales
  test_size: 0.2
  random_state: 42
  model: RandomForestRegressor
  rf_params:
    n_estimators: 120
    max_depth: 12
    n_jobs: -1
    random_state: 42
  use_time_features: true
rl:
  maze_rows: 6
  maze_cols: 6
  start:
  - 0
  - 0
  goal:
  - 5
  - 5
  gamma: 0.95
  alpha: 0.8
  epsilon: 0.2
  episodes: 250
